name: Computer Networks CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check the source
        run: npm run typecheck
      - name: Build the Sites Worker and run regression tests
        run: npm test
      - name: Check that the tracked deployment output matches the build
        run: git diff --exit-code -- dist
